name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["windows-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake -S windows -B windows/build-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build windows/build-release -j

      - name: Test
        run: ctest --test-dir windows/build-release --output-on-failure

      - name: Publish OCR helper
        shell: pwsh
        run: |
          dotnet publish windows/poc/ocr_poc/ocr_poc.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -p:DebugSymbols=false -o windows/dist/ocr

      - name: Package portable zip
        shell: pwsh
        run: |
          $stage = "windows/dist/package"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $stage "ocr") | Out-Null
          Copy-Item windows/build-release/src/app/livezoom_win.exe $stage
          Copy-Item windows/README.md $stage
          Copy-Item windows/dist/ocr/ocr_poc.exe (Join-Path $stage "ocr")
          Compress-Archive -Path (Join-Path $stage "*") `
            -DestinationPath windows/dist/LiveZoom-windows-x64-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: LiveZoom-windows-x64
          path: windows/dist/*.zip
          if-no-files-found: error
